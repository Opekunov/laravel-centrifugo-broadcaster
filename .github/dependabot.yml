version: 2
updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    target-branch: 3.x
    labels:
      - dependencies
    open-pull-requests-limit: 10

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    target-branch: 3.x
    labels:
      - dependencies
    open-pull-requests-limit: 5
